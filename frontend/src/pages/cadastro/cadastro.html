<div class="page-container">
  <div class="page-header">
    <button class="back-btn" (click)="voltar()">Voltar</button>
    <h1>Cadastro</h1>
  </div>
  <div class="page-content">
    <h3>Preencha o cadastro para se registrar</h3>
    <form>
      <div class="form-row">
        <div class="form-group">
          <label>Nome</label>
          <input type="text" [(ngModel)]="nome" name="nome">
        </div>
        <div class="form-group">
          <label>Sobrenome</label>
          <input type="text" [(ngModel)]="sobrenome" name="sobrenome">
        </div>
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" [(ngModel)]="email" name="email">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Senha</label>
          <input type="password" [(ngModel)]="senha" name="senha">
        </div>
        <div class="form-group">
          <label>Confirmar a senha</label>
          <input type="password" [(ngModel)]="confirmarSenha" name="confirmarSenha">
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Registrar</button>
    </form>
  </div>
</div>
