<div class="page-container">
  <div class="page-header">
    <button class="back-btn" (click)="voltar()">Fechar</button>
    <h1>{{ dispositivo?.nome }}</h1>
  </div>
  <div class="page-content">
    <div class="form-group">
      <label>Selecionar indicador</label>
      <select [(ngModel)]="selectedIndicador" name="indicador">
        <option [ngValue]="null" disabled>Selecione...</option>
        @for (item of dispositivo?.indicadores; track item.id) {
          <option [ngValue]="item">{{ item.nome }}</option>
        }
      </select>
    </div>
    <div class="form-group">
      <label>Início das coletas</label>
      <input type="date" [(ngModel)]="event.inicio" name="inicio">
    </div>
    <div class="form-group">
      <label>Fim das coletas</label>
      <input type="date" [(ngModel)]="event.fim" name="fim">
    </div>
    <button class="btn btn-primary" (click)="buscarColetas()" [disabled]="!selectedIndicador">
      Buscar
    </button>
<!--    <div id="container" class="chart-container"></div>-->
  </div>
</div>
