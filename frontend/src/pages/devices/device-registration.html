<div class="page-container">
  <div class="page-header">
    <button class="back-btn" (click)="goBack()">Back</button>
    <h1>Register Device</h1>
  </div>
  <div class="page-content">
    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Device name</label>
        <input type="text" [(ngModel)]="name" name="name">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Latitude</label>
          <input type="number" [(ngModel)]="latitude" name="latitude" step="any">
        </div>
        <div class="form-group">
          <label>Longitude</label>
          <input type="number" [(ngModel)]="longitude" name="longitude" step="any">
        </div>
      </div>
      @if (indicators.length > 0) {
        <div class="form-group">
          <label>Indicators</label>
          <div class="indicator-list">
            @for (ind of indicators; track ind.id) {
              <label class="indicator-item">
                <input type="checkbox" [checked]="isSelected(ind.id)" (change)="toggleIndicator(ind.id)">
                {{ ind.name }} ({{ ind.unit }})
              </label>
            }
          </div>
        </div>
      }
      @if (errorMessage) {
        <p class="error-message">{{ errorMessage }}</p>
      }
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
  </div>
</div>
