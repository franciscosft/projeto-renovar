<div class="page-container">
  <div class="page-header">
    <button class="back-btn" (click)="goBack()">Close</button>
    <h1>{{ device?.name }}</h1>
  </div>
  <div class="page-content">
    <div class="form-group">
      <label>Select indicator</label>
      <select [(ngModel)]="selectedIndicator" name="indicator">
        <option [ngValue]="null" disabled>Select...</option>
        @for (item of device?.indicators; track item.id) {
          <option [ngValue]="item">{{ item.name }}</option>
        }
      </select>
    </div>
    <div class="form-group">
      <label>Start date</label>
      <input type="date" [(ngModel)]="event.startDate" name="startDate">
    </div>
    <div class="form-group">
      <label>End date</label>
      <input type="date" [(ngModel)]="event.endDate" name="endDate">
    </div>
    <button class="btn btn-primary" (click)="fetchReadings()" [disabled]="!selectedIndicator">
      Search
    </button>
    @if (readings.length > 0) {
      <div class="form-group">
        <label>Grouping</label>
        <select [(ngModel)]="selectedGrouping" name="grouping" (ngModelChange)="onGroupingChange()">
          <option value="none">None</option>
          <option value="hour">By hour</option>
          <option value="day">By day</option>
        </select>
      </div>
    }
    <canvas #chartCanvas class="chart-container" [style.display]="readings.length > 0 ? 'block' : 'none'"></canvas>
  </div>
</div>
