logging.level.org.springframework.web=INFO

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:file:~/test
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable RabbitMQ auto-configuration in tests — no broker required
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# API key security — dummy values for test profile
security.device.api-key=test-device-key
security.frontend.subscription-key=test-frontend-key
security.jwt.secret=${JWT_SECRET:renovar-secret-key-256-bits-minimum-length}
